# fly.toml app configuration file generated for is-peco-okay on 2026-11-14T19:17:52-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'is-peco-okay'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[env]
#
# Set this to the AWS S3 prefix of where backups will go
#
PECO_BACKUPS_S3_PREFIX = "s3://dmuth-peco/prod"

#
# Our database path.  This is relative to the main directory of the app, 
# which is /app in the container.
#
SQLITE_DATABASE_PATH = "db.sqlite"

#
# Deployment is behind a reverse proxy, so trust the headers from it.
#
TRUST_PROXY=1
